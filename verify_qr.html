<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Verify QR</title>

  <!-- QR Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    #reader {
      width: 100%;
      margin-bottom: 15px;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    #startScan {
      background: #28a745;
      color: white;
    }

    #stopScan {
      background: #dc3545;
      color: white;
    }

    .verify {
      margin-top: 20px;
      padding: 10px;
      border-radius: 5px;
      background: #f8f9fa;
    }

    .hidden {
      display: none;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Verify QR</h2>

  <div id="reader"></div>

  <button id="startScan">Start Scan</button>
  <button id="stopScan" disabled>Stop Scan</button>

  <div id="verifyResult" class="verify hidden">
    <h3>Verification Result</h3>
    <p id="statusText"></p>
    <div id="details"></div>
  </div>
</div>

<script src="verify_app.js"></script>

</body>
</html>
