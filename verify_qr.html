<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify QR</title>
<style>
  body { font-family: Arial; text-align: center; }
  #reader { width: 100%; margin-bottom: 10px; }
  button { padding: 10px 20px; margin: 5px; }
  .hidden { display: none; }
</style>
</head>
<body>

<h2>Verify QR</h2>
<div id="reader"></div>

<button id="startScan">Start Scan</button>
<button id="stopScan" disabled>Stop Scan</button>

<div id="verifyResult" class="hidden">
  <h3>Result</h3>
  <p id="statusText"></p>
  <div id="details"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>


<!-- Load your JS last, without defer -->
<script src="verify_app.js"></script>

</body>
</html>
